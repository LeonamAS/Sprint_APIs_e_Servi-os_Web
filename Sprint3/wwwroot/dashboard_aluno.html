<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Sistema Escolar</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3" id="nomeUsuario">Bem-vindo(a)!</span>
                <button class="btn btn-danger btn-sm" id="btnSair">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">Minhas Matrículas e Notas</h4>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>Turma</th>
                            <th>Nota</th>
                            <th>Frequência (%)</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaMatriculas">
                        <tr>
                            <td colspan="3" class="text-center text-muted">Carregando dados...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="aluno.js"></script>
</body>
</html>
