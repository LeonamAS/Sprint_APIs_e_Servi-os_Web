<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <style>
        body {
            background-image: url('image_6.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #3e2723;
        }
    </style>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Faculdade Hilberto Silva</a>
            <div class="d-flex">
                <span class="navbar-text text-white me-3" id="nomeUsuario">Bem-vindo(a)!</span>
                <button class="btn btn-danger btn-sm" id="btnSair">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-white">
                        <h4 class="mb-0">Consultar Boletim</h4>
                    </div>
                    <div class="card-body">
                        <form id="formBoletim">
                            <div class="mb-3">
                                <label for="inputNomeAluno" class="form-label">Nome do Aluno</label>
                                <input type="text" class="form-control" id="inputNomeAluno" placeholder="Digite o seu nome completo ou parte dele..." required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Gerar Boletim</button>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm d-none" id="cardResultado">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">Resultado do Boletim</h5>
                    </div>
                    <div class="card-body" id="conteudoBoletim">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="aluno.js"></script>
</body>
</html>
