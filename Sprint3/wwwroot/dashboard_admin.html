<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('image_6.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #3e2723;
        }
    </style>
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #512da8;">
        <div class="container">
            <a class="navbar-brand" href="#">Painel de Administração - FHS</a>
            <div class="d-flex align-items-center">
                <button class="btn btn-outline-light btn-sm me-3" data-bs-toggle="modal" data-bs-target="#modalAdmin">
                    + Novo Admin
                </button>
                <span class="navbar-text text-white me-3">Administrador</span>
                <button class="btn btn-danger btn-sm" id="btnSair">Sair</button>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gestão de Alunos</h5>
                        <p class="card-text text-muted">Cadastre, edite e vincule alunos no sistema.</p>
                        <button class="btn btn-outline-primary w-100">Acessar Módulo</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Gestão de Professores</h5>
                        <p class="card-text text-muted">Cadastre e gerencie o corpo docente.</p>
                        <button class="btn btn-outline-primary w-100">Acessar Módulo</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body text-center">
                        <h5 class="card-title">Turmas e Disciplinas</h5>
                        <p class="card-text text-muted">Crie turmas e associe professores e matérias.</p>
                        <button class="btn btn-outline-primary w-100">Acessar Módulo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAdmin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">Cadastrar Novo Administrador</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="msgModalAdmin"></div>
                    <form id="formNovoAdmin">
                        <div class="mb-3">
                            <label class="form-label">Login ou CPF</label>
                            <input type="text" class="form-control" id="novoAdminLogin" placeholder="Ex: admin_sec" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="novoAdminSenha" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('novoAdminSenha', this)">Mostrar</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Salvar Administrador</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="admin.js"></script>
</body>
</html>
