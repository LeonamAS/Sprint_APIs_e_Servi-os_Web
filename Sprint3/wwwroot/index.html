<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Escolar - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('image_6.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #3e2723;
        }

        .card {
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            background-color: rgb(255, 255, 255);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .card-body, .form-label, h3, a {
            color: #212529 !important;
        }

        .form-control, .form-select {
            background-color: #fff;
            border-color: #ced4da;
        }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">

            <div class="col-md-6" id="cardLogin">
                <div class="card p-4">
                    <img src="logo2.jpg" class="img-fluid mx-auto d-block mb-2" height="120" width="120" alt="logo">
                    <h3 class="text-center mb-4">Faculdade Hilberto Silva</h3>

                    <div id="msgLogin"></div>

                    <form id="formLogin">
                        <div class="mb-3">
                            <label class="form-label">CPF (Admin digite seu Usuário)</label>
                            <input type="text" class="form-control" id="loginCpf" placeholder="Digite seu CPF" required oninput="mascaraLogin(this)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="loginSenha" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('loginSenha', this)">Mostrar</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Entrar</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="#" id="linkIrParaRegistro" class="text-decoration-none text-primary">Não tem uma conta? Registre-se</a>
                    </div>
                </div>
            </div>

            <div class="col-md-5 d-none" id="cardRegistro">
                <div class="card p-4">
                    <h3 class="text-center mb-4">Cadastre-se</h3>

                    <div id="msgRegistro"></div>

                    <form id="formRegistro">
                        <div class="mb-3">
                            <label class="form-label">CPF</label>
                            <input type="text" class="form-control" id="regCpf" placeholder="000.000.000-00" required oninput="aplicarMascaraCpf(this)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="regSenha" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="toggleSenha('regSenha', this)">Mostrar</button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Registrar</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="#" id="linkIrParaLogin" class="text-decoration-none text-primary">Já tem uma conta? Faça Login</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
