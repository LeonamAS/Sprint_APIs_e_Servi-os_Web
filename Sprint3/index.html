<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gestão Acadêmica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

    <div class="container bg-white p-4 rounded shadow-sm">
        <h2 class="mb-4 text-primary">Lista de Alunos</h2>

        <table class="table table-hover">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Matrícula</th>
                    <th>Nome do Aluno</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaAlunos">
            </tbody>
        </table>
    </div>

    <div class="modal fade" id="modalNotas" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Lançar Nota</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formNota">
                        <input type="hidden" id="alunoId">

                        <div class="mb-3">
                            <label>ID da Disciplina</label>
                            <input type="number" id="disciplinaId" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Valor da Nota (0 a 10)</label>
                            <input type="number" step="0.1" id="valorNota" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Salvar Nota</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'https://localhost:5001/api/academico'; // Altere para a porta do seu backend

        // 1. Carregar Alunos na Tabela
        async function carregarAlunos() {
            try {
                // Mock visual para teste se a API estiver desligada:
                // const alunos = [{ id: 1, matricula: '202301', nome: 'João Silva' }, { id: 2, matricula: '202302', nome: 'Maria Souza' }];

                const response = await fetch(`${API_URL}/alunos`);
                const alunos = await response.json();

                const tbody = document.getElementById('tabelaAlunos');
                tbody.innerHTML = '';

                alunos.forEach(aluno => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${aluno.id}</td>
                            <td>${aluno.matricula}</td>
                            <td>${aluno.nome}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="abrirModal(${aluno.id})">
                                    Lançar Notas
                                </button>
                                <button class="btn btn-sm btn-secondary" onclick="verificarBoletim(${aluno.id}, 1)"> Ver Média
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Erro ao buscar alunos', error);
            }
        }

        // 2. Abrir Modal
        function abrirModal(idAluno) {
            document.getElementById('alunoId').value = idAluno;
            new bootstrap.Modal(document.getElementById('modalNotas')).show();
        }

        // 3. Enviar Nota para a API
        document.getElementById('formNota').addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                alunoId: parseInt(document.getElementById('alunoId').value),
                disciplinaId: parseInt(document.getElementById('disciplinaId').value),
                valor: parseFloat(document.getElementById('valorNota').value)
            };

            await fetch(`${API_URL}/notas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert('Nota lançada com sucesso!');
            bootstrap.Modal.getInstance(document.getElementById('modalNotas')).hide();
            e.target.reset();
        });

        // 4. Consumir Endpoint de Regra de Negócio
        async function verificarBoletim(alunoId, disciplinaId) {
            const res = await fetch(`${API_URL}/aluno/${alunoId}/disciplina/${disciplinaId}/boletim`);
            const dados = await res.json();
            alert(`Aluno: ${dados.aluno}\nMédia: ${dados.media}\nStatus: ${dados.status}`);
        }

        // Inicializa a tabela
        carregarAlunos();
    </script>
</body>
</html>
